[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["venv", ".venv", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "PIE", "RUF", "FURB", "EXE"]
ignore = [
    # 專案以繁體中文撰寫訊息、註解與 docstring，全形標點不是混淆字元。
    "RUF001",
    "RUF002",
    "RUF003",
    # Django/DRF declarative class attributes intentionally use lists/dicts.
    "RUF012",
    # manage.py is invoked through Python in this project and need not be executable.
    "EXE001",
]
